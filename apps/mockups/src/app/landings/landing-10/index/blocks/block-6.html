<div class="flex flex-col items-center gap-12 lg:flex-row lg:items-start lg:gap-0">
        <!-- Фото девушки в круге: голова выходит за круг, как в макете -->
        <div class="relative shrink-0 lg:mt-[36px] xl:-ml-[57px]" data-reveal="">
          <div class="relative size-[280px] min-[375px]:size-[330px] sm:size-[512px] lg:size-[440px] xl:size-[512px]">
            <span class="absolute inset-0 rounded-full border border-gold-soft"></span>
            <span class="absolute left-[10.5%] top-[14.5%] size-[79%] overflow-hidden rounded-full bg-[linear-gradient(90deg,#6f5f52_0%,#b8a898_14%,#e8e0d6_30%,#f4efe9_60%,#d9cfc4_80%,#8f7f70_100%)]">
              <span class="absolute inset-[9%] rounded-full border-2 border-white/80"></span>
            </span>
            <!-- две копии фото: целиком внутри круга и верхняя треть (голова) поверх края круга -->
            <span class="absolute left-[10.5%] top-[14.5%] size-[79%] overflow-hidden rounded-full">
              <img src="/legacy/landing-10/images/girl.png" alt="Специалист салона" class="absolute left-[4.4%] top-[-26%] w-[91%] max-w-none">
            </span>
            <img src="/legacy/landing-10/images/girl.png" alt="" aria-hidden="true" class="absolute left-[14%] top-[-6%] w-[72%] max-w-none [clip-path:inset(0_0_86%_0)]">
          </div>
        </div>
        <div class="w-full min-w-0 lg:ml-[40px] lg:max-w-[560px] xl:ml-[62px]">
          <div data-reveal="">
            <h2 class="relative font-serif text-[34px] font-normal leading-[1.05] sm:text-[48px]">
              <span class="line absolute -left-[122px] top-[26px] hidden xl:block"></span>
              Оставьте заявку,<br>и получите
              <span class="text-gold">пошив<br>штор в подарок!</span>
            </h2>
            <p class="mt-10 max-w-[500px] text-[14px] leading-[22px] text-mute">
              После отправки заявки, с вами свяжется наш специалист, который проконсультирует вас по
              вопросам свввязанным с пошивом, материалами и диайну.
            </p>
            <p class="mt-6 flex items-center gap-4 font-serif text-[22px] font-normal sm:whitespace-nowrap">
              <img src="/legacy/landing-10/images/ico-clock.png" alt="" class="size-10">Длительность консультации: ±
              15 минут
            </p>
          </div>
          <form id="lead" class="mt-[70px] max-w-[430px]" novalidate="" data-reveal="">
            <label class="flex items-center gap-3 border-b border-gold pb-4">
              <img src="/legacy/landing-10/images/ico-phone-s.png" alt="" class="size-[26px]">
              <input name="phone" type="tel" required="" placeholder="Введите ваш номер телефона" class="max-lg:h-10 w-full bg-transparent text-[14px] text-ink outline-none placeholder:text-mute">
            </label>
            <p data-error="" class="mt-2 hidden text-[12px] text-red-600">Введите номер телефона</p>
            <button type="submit" class="btn mt-8 w-full sm:w-[274px]">
              Заказать консультацию
            </button>
            <p data-thanks="" class="mt-6 hidden font-serif text-[24px] font-normal text-gold">
              Спасибо!
            </p>
          </form>
        </div>
      </div>
